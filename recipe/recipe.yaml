context:
  version: "0.17"

package:
  name: otrobopt
  version: ${{ version }}

source:
  url: https://github.com/openturns/otrobopt/archive/v${{ version }}.tar.gz
  sha256: 1078a3c4c940ea657ada238fb7f31a8c2da0de82814a52ac36d40ca49043c9d9

build:
  number: 3
  python:
    version_independent: true

requirements:
  build:
    - cmake
    - swig
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - if: unix
      then: make
      else: ninja
    - if: win
      then: m2-diffutils
    - if: build_platform != target_platform
      then:
        - python-abi3 ${{ python_min }}.*
        - python ${{ python_min }}.*
        - cross-python_${{ target_platform }}
  host:
    - python-abi3 ${{ python_min }}.*
    - python ${{ python_min }}.*
    - openturns
  run:
    - python >=${{ python_min }}
  run_exports:
    - ${{ pin_subpackage('otrobopt', upper_bound='x.x') }}

tests:
  - python:
      imports:
        - otrobopt

about:
  homepage: http://openturns.org/
  license: LGPL-3.0-or-later
  license_family: LGPL
  license_file: COPYING.LESSER
  summary: Robust optimization module
  documentation: https://openturns.github.io/otrobopt/master/
  repository: https://github.com/openturns/otrobopt

extra:
  recipe-maintainers:
    - jschueller
